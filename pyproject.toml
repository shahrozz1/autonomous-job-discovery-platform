[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roleful"
version = "1.0.0"
description = "An autonomous job discovery platform for entry-level analyst and operations roles"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shahroz Zameer" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
ai = ["anthropic>=2.0", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
roleful = "roleful.cli:main"

[tool.setuptools]
packages = ["roleful", "roleful.sources"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
