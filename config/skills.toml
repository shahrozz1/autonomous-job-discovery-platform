# The skills to look for in a posting.
#   match       found in any capitalization
#   match_case  found only when capitalized exactly like this
#   except      a match inside one of these doesn't count
# All are regular expressions, checked one line at a time.

[[skill]]
name = "Excel"
# "Excel" is also a verb, and job postings love it: "you will excel in this role", "Excel in a
# fast-paced environment". Capitalized, it counts unless it opens a sentence as a verb. Lowercase,
# it counts only next to words that make it clearly the software.
match = [
  '\b(microsoft|ms|office|advanced|intermediate)[ -]*excel\b',
  '\bexcel (skills?|spreadsheets?|models?|modeling|formulas?|functions?|macros?|workbooks?|proficiency|pivot)',
  '\b(word|powerpoint|outlook|access|sheets|tableau|sql|python|suite|like|using|via)[,/ &(]+(and |or )?excel\b(?! (in|at|as|both|under|within)\b)',
  '\bexcel[,/ &]+(and |or )?(word|powerpoint|outlook|google|sql|tableau|power ?bi|vba|python|sheets)\b',
  '\b(proficien\w+|fluen\w+|experience|knowledge|skilled|expertise|command) (in|with|of|using) excel\b',
  '\b(use|using|utiliz\w+|with) excel\b',
]
match_case = ['\bExcel\b', '\bEXCEL\b']
except = ['(^|^- |[.!?:;]\s+)Excel (in|at|as|under|within|while|when|by|both|through|and (grow|thrive))\b']

[[skill]]
name = "SQL"
match = ['\b(sql|mysql|postgres(ql)?|t-?sql|pl/?sql)\b']
except = ['\bno-?sql\b']

[[skill]]
name = "Python"
match = ['\bpython\b']

[[skill]]
name = "R"
match = ['\brstudio\b']
match_case = [
  '\b(Python|SQL|SAS|Stata|SPSS|MATLAB|Matlab|Julia|Tableau|Excel)\b[^.;\n]{0,25}\bR\b(?!\s?&|\.)',
  '\bR\b(?!\s?&)(?=[^.;\n]{0,25}\b(Python|SQL|SAS|Stata|SPSS|MATLAB|Matlab|Julia|Tableau)\b)',
  '\bR (programming|language|Studio)\b',
]
except = ['R\s?&\s?D']

