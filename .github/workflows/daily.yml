name: daily run

# Reads every board on weekday mornings, checks the data and rebuilds the dashboard. Nothing is
# committed: the database is kept in the Actions cache and the dashboard is saved with each run.

on:
  schedule:
    - cron: "23 13 * * 1-5" # 7:23 am Central (8:23 in summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Get yesterday's database
        uses: actions/cache/restore@v6
        with:
          path: data
          key: roleful-db-${{ github.run_id }}
          restore-keys: roleful-db-

      - name: Read the boards and check the data
        run: python -m roleful run

      - name: Build the dashboard
        run: |
          python -m roleful export
          python -m roleful report >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the database for tomorrow
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: data
          key: roleful-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: site

      - name: Package the dashboard for GitHub Pages
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    # Off until the repository variable PUBLISH_PAGES is set to "true".
    if: vars.PUBLISH_PAGES == 'true'
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
